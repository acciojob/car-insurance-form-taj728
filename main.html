<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
	<div>
		<form method="post">
			<label for="name">Name</label>
			<div>
				<input id="name" required type="text">
			</div>

			<label for="email">Email</label>
			<div>
				<input id="email" required type="email">
			</div>

			<label>Gender</label>
			<div>
				<input type="radio" id="male" required name="gender">
				<label>Male</label>
				<input type="radio" id="fmale" required name="gender">
				<label>Female</label>
			</div>

			<label for="cars">Car Brands</label>
			<div>
			<select id="cars">
				<option value="">Select options</option>
				<option value="BMW">BMW</option>
				<option value="Audi">Audi</option>
				<option value="BMW">Audi</option>
				<option value="Mercedez">Mercedez</option>
			</select>
			</div>

			<label for="carage">Car Age</label>
			<div>
				<input type="number" id="carage" required>
			</div>
			<label for="dop">Date of Purchase (dop)</label>
			<div>
				<input type="date" id="dop" required>
			</div>

			<label>Password</label>
			<div>
				<input type="password" id="password" required>
			</div>
			<button  type="submit">Submit Button</button>
		</form>
	</div>
</body>

</html>
