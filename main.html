<form method="post">
	<label for="name">Name</label>
	<div>
		<input type="id" id="name" required>
	</div>
    <label for="email">Email</label>
    <div>
        <input id="email" name="email" required type="email">
    </div>

    <label>Gender</label>
    <div>
        <input type="radio" id="male" required name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" required name="gender" value="female">
        <label for="female">Female</label>
    </div>

    <label for="cars">Car Brands</label>
    <div>
        <select id="cars" name="cars">
            <option value="">Select options</option>
            <option value="BMW">BMW</option>
            <option value="Audi">Audi</option>
            <option value="Mercedes">Mercedes</option>
        </select>
    </div>

    <label for="carage">Car Age</label>
    <div>
        <input type="number" id="carage" name="carage" required>
    </div>

    <label for="dop">Date of Purchase (dop)</label>
    <div>
        <input type="date" id="dop" name="dop" required>
    </div>

    <label for="password">Password</label>
    <div>
        <input type="password" id="password" name="password" required>
    </div>

    <button type="submit">Submit Button</button>

</form>
